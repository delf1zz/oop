name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect task directory
        id: detect
        run: |
          if [ -n "${{ github.head_ref }}" ] && [ -d "${{ github.head_ref }}" ]; then
            TASK_DIR="${{ github.head_ref }}"
          else
            TASK_DIR=$(ls -d Task_* | sort -V | tail -n 1)
          fi
          echo "task=$TASK_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected task: $TASK_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        working-directory: ./${{ steps.detect.outputs.task }}
        run: chmod +x ./gradlew

      - name: Execute Gradle build and tests
        working-directory: ./${{ steps.detect.outputs.task }}
        run: ./gradlew build jacocoTestReport

      - name: Check coverage and publish
        id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        if: always()
        with:
          paths: ${{ github.workspace }}/${{ steps.detect.outputs.task }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Generate javadoc
        working-directory: ./${{ steps.detect.outputs.task }}
        run: ./gradlew javadoc

      - name: Publish javadoc
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          folder: ${{ steps.detect.outputs.task }}/build/docs/javadoc
          target-folder: ${{ steps.detect.outputs.task }}

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: '.github/google_checks.xml'
          reporter: 'github-pr-check'

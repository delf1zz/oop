name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Task Directory
        id: find_task
        run: |
          TASK_DIR=$(find . -maxdepth 1 -type d -name "Task_*" | sed 's|^\./||' | head -n 1)
          if [ -z "$TASK_DIR" ]; then
            echo "Error: Task directory not found!"
            exit 1
          fi
          echo "task_dir=$TASK_DIR" >> $GITHUB_OUTPUT
          echo "Found task directory: $TASK_DIR"

      - name: Make gradlew executable
        working-directory: ./${{ steps.find_task.outputs.task_dir }}
        run: chmod +x ./gradlew

      - name: Execute Gradle build and tests
        working-directory: ./${{ steps.find_task.outputs.task_dir }}
        run: ./gradlew build jacocoTestReport

      - name: Check coverage and publish
        id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        if: always()
        with:
          paths: ${{ github.workspace }}/${{ steps.find_task.outputs.task_dir }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Generate javadoc
        working-directory: ./${{ steps.find_task.outputs.task_dir }}
        run: ./gradlew javadoc

      - name: Publish javadoc
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true
          folder: ${{ steps.find_task.outputs.task_dir }}/build/docs/javadoc
          target-folder: ${{ steps.find_task.outputs.task_dir }}

  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: '.github/google_checks.xml'
          reporter: 'github-pr-check'